name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # 注意:CI 只装核心依赖 (Pillow / opencv-python / numpy / python-pptx)。
      # paddlepaddle + torch + simple-lama-inpainting 体积过大(>2GB),在 CI 里跳过;
      # 它们只在实际跑 px2pptx_batch.py / mineru2pptx.py 时需要。
      - name: Install core deps for tests
        run: |
          python -m pip install --upgrade pip
          pip install "Pillow>=10.0" "numpy>=1.24" "opencv-python>=4.8" "python-pptx>=0.6.21"
          pip install "pytest>=7" "ruff>=0.1"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests
        run: pytest tests/ -v
